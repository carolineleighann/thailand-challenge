<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thailand Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f0e8; color: #2a2218; font-family: 'DM Mono', monospace; min-height: 100vh; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #d4c9b8; border-radius: 2px; }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

    .dc { transition: transform 0.12s ease, box-shadow 0.12s ease; cursor: pointer; }
    .dc:hover { transform: scale(1.06); }
    .tb { cursor: pointer; transition: all 0.15s ease; }
    .tb:hover { opacity: 0.8; }
    .pb { cursor: pointer; transition: all 0.18s ease; border: none; }
    .pb:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(139,100,50,0.25); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .fu { animation: fadeUp 0.3s ease forwards; }

    @keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
    .shimmer {
      background: linear-gradient(90deg, #8b6432, #c9a96e, #8b6432, #b8893e, #8b6432);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 5s linear infinite;
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #a89880;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e0d8cc;
    }

    .card {
      background: #fff;
      border: 1px solid #e8e0d4;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(139,100,50,0.06);
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 12px;
      letter-spacing: 1px;
      z-index: 999;
      animation: fadeUp 0.2s ease;
      white-space: nowrap;
    }

    input:focus { border-color: #c9a96e !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const START_DATE = new Date(2026, 5, 1);
    const TOTAL_DAYS = 45;
    const MAX_DRINK_DAYS = 4;
    const STORAGE_KEY = "thailand-challenge-v5";

    function getDayNumber() {
      const today = new Date(); today.setHours(0,0,0,0);
      const start = new Date(START_DATE); start.setHours(0,0,0,0);
      return Math.floor((today - start) / 86400000) + 1;
    }
    function fDate(n) {
      const d = new Date(START_DATE); d.setDate(d.getDate() + n - 1);
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    }
    function fDay(n, short = false) {
      const d = new Date(START_DATE); d.setDate(d.getDate() + n - 1);
      return d.toLocaleDateString("en-US", { weekday: short ? "short" : "long" });
    }

    const GOALS = [
      { icon: "🥗", label: "Calories",  goal: "≤ 1,900 avg / day",    color: "#3a86cc", bg: "#eef5fc" },
      { icon: "💪", label: "Workouts",  goal: "4x per week",           color: "#2e9e6b", bg: "#edf7f2" },
      { icon: "👟", label: "Steps",     goal: "≥ 6,000 / day",         color: "#b07d20", bg: "#faf4e8" },
      { icon: "🍷", label: "Alcohol",   goal: "4 days max · 4 drinks", color: "#b04060", bg: "#faeef1" },
    ];

    const STATUS = {
      future:  { bg: "#f9f6f2", border: "#ede8e0", text: "#c8bfb0" },
      missed:  { bg: "#fff0f0", border: "#f5c8c8", text: "#d05050" },
      perfect: { bg: "#edf7f2", border: "#90d8b0", text: "#2e9e6b" },
      good:    { bg: "#fef9ec", border: "#e8d080", text: "#9a7820" },
      partial: { bg: "#fff4ec", border: "#f0c898", text: "#c07030" },
    };

    function App() {
      const [days, setDays] = useState(() => {
        try { const s = localStorage.getItem(STORAGE_KEY); return s ? JSON.parse(s) : {}; } catch { return {}; }
      });
      const [sel, setSel] = useState(null);
      const [view, setView] = useState("grid");
      const [vals, setVals] = useState({ calories: "", steps: "", workout: false, drinks: 0 });
      const [toast, setToast] = useState(null);
      const cur = getDayNumber();

      function saveDay(n, data) {
        const updated = { ...days, [n]: data };
        setDays(updated);
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
          setToast("✓  Day saved");
        } catch { setToast("⚠  Save failed"); }
        setTimeout(() => setToast(null), 2200);
        setView("grid"); setSel(null);
      }

      function openDay(n) {
        if (n > TOTAL_DAYS) return;
        const existing = days[n] || { calories: "", steps: "", workout: false, drinks: 0 };
        // Normalize legacy 0 drinks
        if (existing.drinks === 0 || existing.drinks === "0") existing.drinks = 0;
        setVals(existing);
        setSel(n); setView("detail");
      }

      function getStatus(n) {
        if (n > cur) return "future";
        const d = days[n]; if (!d) return "missed";
        const dr = d.drinks === "5+" ? 5 : (parseInt(d.drinks) || 0);
        const caloriesOk = d.calories && parseInt(d.calories) <= 1900;
        const stepsOk = d.steps && parseInt(d.steps) >= 6000;
        const drinksOk = dr <= 4;
        const hasCalories = !!d.calories;
        const hasSteps = !!d.steps;
        // Only perfect if both calories and steps were actually logged
        if (caloriesOk && stepsOk && drinksOk) return "perfect";
        const p = [caloriesOk, stepsOk, drinksOk && (hasCalories || hasSteps)].filter(Boolean).length;
        if (p >= 2) return "good";
        if (p >= 1) return "partial";
        return "partial";
      }

      const logged = Object.keys(days).map(Number);
      const totalLogged = logged.length;
      const perfect = logged.filter(d => getStatus(d) === "perfect").length;
      const workouts = logged.filter(d => days[d]?.workout).length;
      const drinkDaysUsed = logged.filter(d => {
        const dr = days[d]?.drinks;
        return dr && dr !== 0 && dr !== "0" && parseInt(dr) > 0;
      }).length;
      const totalDrinks = logged.reduce((s, d) => {
        const dr = days[d]?.drinks;
        return s + (dr === "5+" ? 5 : (parseInt(dr) || 0));
      }, 0);
      const calDays = logged.filter(d => days[d]?.calories);
      const avgCals = calDays.length ? Math.round(calDays.reduce((s, d) => s + parseInt(days[d].calories), 0) / calDays.length) : null;
      const stepDays = logged.filter(d => days[d]?.steps);
      const avgSteps = stepDays.length ? Math.round(stepDays.reduce((s, d) => s + parseInt(days[d].steps), 0) / stepDays.length) : null;

      // Weekly workout tracking
      function getWeekWorkouts(dayNum) {
        const weekStart = Math.floor((dayNum - 1) / 7) * 7 + 1;
        const weekEnd = Math.min(weekStart + 6, TOTAL_DAYS);
        return Array.from({ length: weekEnd - weekStart + 1 }, (_, i) => weekStart + i)
          .filter(d => days[d]?.workout).length;
      }
      const remaining = Math.max(0, TOTAL_DAYS - cur + 1);
      const pct = Math.min(100, ((cur - 1) / TOTAL_DAYS) * 100);
      const drinkDaysLeft = MAX_DRINK_DAYS - drinkDaysUsed;

      return (
        <div style={{ minHeight: "100vh", background: "#f5f0e8" }}>
          {toast && (
            <div className="toast" style={{
              background: toast.startsWith("✓") ? "#2e9e6b" : "#d05050",
              color: "#fff", fontWeight: 500,
            }}>{toast}</div>
          )}

          <div style={{ maxWidth: 580, margin: "0 auto", padding: "44px 18px 80px" }}>

            {/* ── HERO ── */}
            <div style={{ textAlign: "center", marginBottom: 48 }}>
              <div style={{ fontSize: 10, letterSpacing: 5, color: "#b8a898", marginBottom: 14, textTransform: "uppercase" }}>45 Day Challenge</div>
              <h1 style={{ fontFamily: "'Playfair Display', serif", fontSize: 54, fontWeight: 700, lineHeight: 1, marginBottom: 6 }}>
                <span className="shimmer">Thailand</span>
              </h1>
              <div style={{ fontFamily: "'Playfair Display', serif", fontStyle: "italic", fontSize: 15, color: "#b8a898", marginBottom: 30 }}>
                Jun 1 — Jul 15, 2026
              </div>
              <div style={{ background: "#e8e0d4", borderRadius: 6, height: 6, overflow: "hidden", marginBottom: 10 }}>
                <div style={{ height: "100%", width: `${pct}%`, background: "linear-gradient(90deg, #c9a96e, #2e9e6b)", borderRadius: 6, transition: "width 0.6s ease" }} />
              </div>
              <div style={{ fontSize: 11, color: "#b8a898", letterSpacing: 1 }}>
                {cur < 1 ? `Starts in ${1 - cur} day${1 - cur !== 1 ? "s" : ""}` :
                 cur > TOTAL_DAYS ? "🎉 Challenge complete!" :
                 `Day ${cur} of 45  ·  ${remaining} days until Thailand`}
              </div>
            </div>

            {/* ── GOALS ── */}
            <div style={{ marginBottom: 36 }}>
              <div className="section-label">Goals</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                {GOALS.map((g, i) => (
                  <div key={i} className="card" style={{
                    borderLeft: `4px solid ${g.color}`,
                    padding: "14px 16px",
                    display: "flex", alignItems: "center", gap: 12,
                  }}>
                    <div style={{ fontSize: 24 }}>{g.icon}</div>
                    <div>
                      <div style={{ fontSize: 10, color: "#a89880", textTransform: "uppercase", letterSpacing: 1, marginBottom: 3 }}>{g.label}</div>
                      <div style={{ fontSize: 12, color: g.color, fontWeight: 500 }}>{g.goal}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* ── RESULTS ── */}
            <div style={{ marginBottom: 36 }}>
              <div className="section-label">Results</div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 10, marginBottom: 10, gridAutoRows: "1fr" }}>
                {[
                  { label: "Days Logged",   value: totalLogged,    sub: `of ${TOTAL_DAYS} total`,              color: "#3a86cc" },
                  { label: "Workouts Done", value: workouts,       sub: "total · goal: 4x/week",              color: "#2e9e6b" },
                  { label: "Avg Calories",  value: avgCals || "—", sub: avgCals ? "cal / day" : "no data yet", color: "#b04060" },
                  { label: "Avg Steps",     value: avgSteps ? avgSteps.toLocaleString() : "—", sub: avgSteps ? "steps / day" : "no data yet", color: "#7a6aa0" },
                ].map((r, i) => (
                  <div key={i} className="card" style={{ padding: "18px", textAlign: "center" }}>
                    <div style={{ fontSize: 34, fontWeight: 500, color: r.color, lineHeight: 1, marginBottom: 5 }}>{r.value}</div>
                    <div style={{ fontSize: 11, color: "#5a5048", marginBottom: 3 }}>{r.label}</div>
                    <div style={{ fontSize: 10, color: "#b8a898" }}>{r.sub}</div>
                  </div>
                ))}
              </div>

              {/* Drink tracker */}
              <div className="card" style={{ padding: "16px 20px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <div>
                  <div style={{ fontSize: 10, color: "#a89880", textTransform: "uppercase", letterSpacing: 1, marginBottom: 5 }}>🍷 Drink Days</div>
                  <div style={{ fontSize: 13, color: drinkDaysLeft > 0 ? "#b04060" : "#d05050", fontWeight: 500 }}>
                    {drinkDaysLeft > 0 ? `${drinkDaysLeft} of ${MAX_DRINK_DAYS} remaining` : "All used up"}
                  </div>
                </div>
                <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 8 }}>
                  <div style={{ display: "flex", gap: 7 }}>
                    {Array.from({ length: MAX_DRINK_DAYS }).map((_, i) => (
                      <div key={i} style={{
                        width: 14, height: 14, borderRadius: "50%",
                        background: i < drinkDaysUsed ? "#b04060" : "#e8e0d4",
                        border: i < drinkDaysUsed ? "none" : "1px solid #d4c9b8",
                      }} />
                    ))}
                  </div>
                  <div style={{ fontSize: 10, color: "#b8a898" }}>{totalDrinks} drinks logged</div>
                </div>
              </div>
            </div>

            {/* ── TRACKER ── */}
            {view === "grid" && (
              <div className="fu">
                <div className="section-label">Daily Tracker</div>
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
                  {[["#2e9e6b","All 4 ✓"],["#9a7820","2–3 ✓"],["#c07030","1 ✓"],["#d05050","Not logged"]].map(([c,l]) => (
                    <div key={l} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 10, color: "#a89880" }}>
                      <div style={{ width: 8, height: 8, borderRadius: 2, background: c }} />{l}
                    </div>
                  ))}
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(8, 1fr)", gap: 6 }}>
                  {Array.from({ length: TOTAL_DAYS }, (_, i) => {
                    const n = i + 1;
                    const s = getStatus(n);
                    const c = STATUS[s];
                    const isToday = n === cur;
                    const dr = days[n]?.drinks;
                    const drinkVal = days[n]?.drinks;
                    const hadDrinks = drinkVal !== undefined && drinkVal !== null && drinkVal !== 0 && drinkVal !== "0" && parseInt(drinkVal) > 0;
                    return (
                      <div key={n} className="dc" onClick={() => openDay(n)} style={{
                        background: c.bg,
                        border: `1px solid ${isToday ? "#c9a96e" : c.border}`,
                        borderRadius: 10, padding: "9px 4px", textAlign: "center",
                        boxShadow: isToday ? "0 0 0 2px #c9a96e, 0 4px 16px rgba(201,169,110,0.25)" : "0 1px 4px rgba(139,100,50,0.06)",
                      }}>
                        <div style={{ fontSize: 13, fontWeight: 500, color: isToday ? "#8b6432" : c.text }}>{n}</div>
                        <div style={{ fontSize: 8, color: "#c0b8a8", marginTop: 2 }}>{fDay(n, true)}</div>
                        <div style={{ fontSize: 7, color: "#d0c8b8", marginTop: 1 }}>{fDate(n)}</div>
                        <div style={{ fontSize: 9, marginTop: 3, minHeight: 14 }}>
                          {days[n]?.workout && <span>💪</span>}
                          {hadDrinks && <span>🍷</span>}
                        </div>
                        {isToday && s === "missed" && <div style={{ fontSize: 7, color: "#c9a96e", marginTop: 2, fontWeight: 500 }}>TODAY</div>}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ── DAY DETAIL ── */}
            {view === "detail" && sel && (
              <div className="fu">
                <div className="section-label">Log Day {sel}</div>
                <div className="card" style={{ padding: 26 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 28 }}>
                    <div>
                      <div style={{ fontSize: 22, fontFamily: "'Playfair Display', serif", color: "#2a2218" }}>{fDay(sel)}</div>
                      <div style={{ fontSize: 13, color: "#b8a898", marginTop: 3 }}>{fDate(sel)} · Day {sel}</div>
                    </div>
                    <button onClick={() => setView("grid")} style={{
                      background: "#f5f0e8", border: "1px solid #e0d8cc",
                      borderRadius: 8, color: "#a89880", fontSize: 12, padding: "7px 14px", cursor: "pointer",
                    }}>← Back</button>
                  </div>

                  {/* Calories */}
                  <div style={{ marginBottom: 22 }}>
                    <div style={{ fontSize: 10, color: "#3a86cc", letterSpacing: 3, textTransform: "uppercase", marginBottom: 10, display: "flex", alignItems: "center", gap: 8 }}>
                      🥗 Calories <span style={{ color: "#c0b8a8", fontWeight: 300 }}>goal: ≤ 1,900</span>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                      <input type="number" placeholder="e.g. 1650" value={vals.calories}
                        onChange={e => setVals(p => ({ ...p, calories: e.target.value }))}
                        style={{ background: "#fafaf8", border: "1px solid #e0d8cc", borderRadius: 10, color: "#2a2218", fontSize: 20, padding: "11px 14px", width: 150, outline: "none", fontFamily: "'DM Mono', monospace", transition: "border-color 0.15s" }} />
                      {vals.calories && (
                        <div style={{ fontSize: 12, fontWeight: 500, color: parseInt(vals.calories) <= 1900 ? "#2e9e6b" : "#d05050" }}>
                          {parseInt(vals.calories) <= 1900 ? "✓ On track" : `+${parseInt(vals.calories) - 1900} over`}
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Steps */}
                  <div style={{ marginBottom: 22 }}>
                    <div style={{ fontSize: 10, color: "#b07d20", letterSpacing: 3, textTransform: "uppercase", marginBottom: 10, display: "flex", alignItems: "center", gap: 8 }}>
                      👟 Steps <span style={{ color: "#c0b8a8", fontWeight: 300 }}>goal: ≥ 6,000</span>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                      <input type="number" placeholder="e.g. 7200" value={vals.steps}
                        onChange={e => setVals(p => ({ ...p, steps: e.target.value }))}
                        style={{ background: "#fafaf8", border: "1px solid #e0d8cc", borderRadius: 10, color: "#2a2218", fontSize: 20, padding: "11px 14px", width: 150, outline: "none", fontFamily: "'DM Mono', monospace", transition: "border-color 0.15s" }} />
                      {vals.steps && (
                        <div style={{ fontSize: 12, color: parseInt(vals.steps) >= 6000 ? "#2e9e6b" : "#d05050" }}>
                          {parseInt(vals.steps) >= 6000 ? "✓ Goal hit" : `${(6000 - parseInt(vals.steps)).toLocaleString()} to go`}
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Workout */}
                  <div style={{ marginBottom: 22 }}>
                    <div style={{ fontSize: 10, color: "#2e9e6b", letterSpacing: 3, textTransform: "uppercase", marginBottom: 10 }}>💪 Workout</div>
                    <div style={{ display: "flex", gap: 8 }}>
                      {["Rest day", "Worked out! 💪"].map((label, i) => (
                        <div key={i} className="tb" onClick={() => setVals(p => ({ ...p, workout: i === 1 }))} style={{
                          padding: "11px 20px", borderRadius: 10, fontSize: 12, flex: 1, textAlign: "center",
                          background: (i === 1 ? vals.workout : !vals.workout)
                            ? (i === 1 ? "#edf7f2" : "#f5f0e8") : "#fafaf8",
                          border: `1px solid ${(i === 1 ? vals.workout : !vals.workout)
                            ? (i === 1 ? "#90d8b0" : "#e0d8cc") : "#e8e4dc"}`,
                          color: (i === 1 ? vals.workout : !vals.workout)
                            ? (i === 1 ? "#2e9e6b" : "#5a5048") : "#c0b8a8",
                          fontWeight: (i === 1 ? vals.workout : !vals.workout) ? 500 : 300,
                        }}>{label}</div>
                      ))}
                    </div>
                  </div>

                  {/* Drinks */}
                  <div style={{ marginBottom: 28 }}>
                    <div style={{ fontSize: 10, color: "#b04060", letterSpacing: 3, textTransform: "uppercase", marginBottom: 10, display: "flex", alignItems: "center", gap: 8 }}>
                      🍷 Drinks <span style={{ color: "#c0b8a8", fontWeight: 300 }}>{drinkDaysLeft} day{drinkDaysLeft !== 1 ? "s" : ""} left</span>
                    </div>
                    <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                      {[0, 1, 2, 3, 4, "5+"].map(val => {
                        const isSel = vals.drinks === val;
                        const isOver = val === "5+";
                        return (
                          <div key={val} className="tb" onClick={() => setVals(p => ({ ...p, drinks: val }))} style={{
                            padding: "10px 14px", borderRadius: 10, fontSize: 13, minWidth: 54, textAlign: "center",
                            background: isSel ? (isOver ? "#fff0f0" : val === 0 ? "#edf7f2" : "#faeef1") : "#fafaf8",
                            border: `1px solid ${isSel ? (isOver ? "#f5a8a8" : val === 0 ? "#90d8b0" : "#e8a0b8") : "#e8e4dc"}`,
                            color: isSel ? (isOver ? "#d05050" : val === 0 ? "#2e9e6b" : "#b04060") : "#c0b8a8",
                            fontWeight: isSel ? 500 : 300,
                          }}>
                            {val === 0 ? "None" : val === "5+" ? "5+ ⚠️" : `${val} 🍷`}
                          </div>
                        );
                      })}
                    </div>
                    {vals.drinks > 0 && vals.drinks !== "5+" && (
                      <div style={{ fontSize: 11, color: "#2e9e6b", marginTop: 10 }}>✓ Within limit — counts as perfect</div>
                    )}
                    {vals.drinks === "5+" && (
                      <div style={{ fontSize: 11, color: "#d05050", marginTop: 10 }}>Over the limit — won't count as perfect</div>
                    )}
                  </div>

                  <button className="pb" onClick={() => saveDay(sel, vals)} style={{
                    width: "100%", padding: "15px", borderRadius: 12,
                    background: "linear-gradient(135deg, #c9a96e, #b07d20)",
                    color: "#fff", fontSize: 13, fontWeight: 500, letterSpacing: 3, textTransform: "uppercase",
                    fontFamily: "'DM Mono', monospace",
                  }}>
                    Save Day {sel}
                  </button>
                </div>
              </div>
            )}

            <div style={{ textAlign: "center", marginTop: 52, fontSize: 10, color: "#d4c9b8", letterSpacing: 3 }}>THAILAND · JULY 2026</div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
